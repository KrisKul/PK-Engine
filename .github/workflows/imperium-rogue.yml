name: Imperium Rogue Clean Build

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20250512
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      COMPARE: 0
      UNUSED_ERROR: 1
    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libpng-dev libelf-dev git python3

      - name: Fetch pinned Imperium v1.2 source
        run: |
          git init imperium-src
          cd imperium-src
          git remote add origin https://github.com/iriv24/pokeemerald-expansion.git
          git fetch --depth=1 origin f8c9fbb73cc4f3853b056aebfc427d6e4822ea9b
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "f8c9fbb73cc4f3853b056aebfc427d6e4822ea9b"

      - name: Use committed generated Poryscript output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          missing = []
          for source in Path("imperium-src/data").rglob("*.pory"):
              generated = source.with_suffix(".inc")
              if not generated.exists():
                  missing.append(str(generated))
              else:
                  generated.touch()
          if missing:
              raise SystemExit("Missing generated Poryscript files:\n" + "\n".join(missing))
          PY

      - name: Apply Rogue patch
        run: python3 imperium-rogue/apply_rogue_patch.py imperium-src

      - name: Build ROM
        run: |
          cd imperium-src
          make -j"$(nproc)" -O all

      - name: Run source checks
        run: |
          cd imperium-src
          make -j"$(nproc)" check

      - name: Record ROM hash
        run: sha256sum imperium-src/pokeemerald.gba

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: Imperium-Rogue-v0.1.4-clean
          path: imperium-src/pokeemerald.gba
